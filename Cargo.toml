
[package]
authors = ["YAT Team"]
edition = "2021"
name = "yat-fe-linux"
version = "0.1.0"

[[bin]]
name = "yat-client"
path = "src/main.rs"

[dependencies]
# Core modules (git submodules)
yat-wireguard = { path = "modules/tunnel/wireguard"}
yat-transport = { path = "modules/tunnel/transport"}

# CLI
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Template rendering
minijinja = { version = "2", features = ["loader"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
chrono = { version = "0.4", features = ["serde"] }
x509-parser = "0.16"
sha2 = "0.10"
base64 = "0.22"

[profile.release]
lto = true
strip = "symbols"
