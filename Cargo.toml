
[package]
authors = ["YAT Team"]
edition = "2021"
name = "yat-fe-linux"
version = "0.1.0"

[[bin]]
name = "yat-cli"
path = "src/main.rs"

[dependencies]
# Core modules (from yat-modules submodule)
yat-wireguard = { path = "../modules/tunnel/wireguard", default-features = false }
tunnel = { path = "../modules/tunnel/transport", default-features = false }
# Core modules (private git repos)
#yat-wireguard = { git = "ssh://git@git.youxiner.com:10022/yat/wireguard-napi-rs.git", default-features = false }
#tunnel = { git = "ssh://git@git.youxiner.com:10022/yat/tunnel-napi.git", default-features = false }

# CLI
clap = { version = "4", features = ["derive"] }
libc = "0.2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Template rendering
minijinja = { version = "2", features = ["loader"] }

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Misc
chrono = { version = "0.4", features = ["serde"] }
x509-parser = "0.16"
sha2 = "0.10"
base64 = "0.22"

[profile.release]
lto = true
strip = "symbols"
