name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - '*'

env:
  GHCR: ghcr.io/tunnel6/yat-client-linux

jobs:
  # ── Build Stage ────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            cross_compile: '0'
          - target: x86_64-unknown-linux-musl
            cross_compile: '1'
          - target: aarch64-unknown-linux-gnu
            cross_compile: '1'
          - target: aarch64-unknown-linux-musl
            cross_compile: '1'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          export XDG_CACHE_HOME="${{ github.workspace }}/.cache"
          mkdir -p "${XDG_CACHE_HOME}"
          ulimit -n 8192 || true

      - name: Authenticate and Update Git Submodules
        env:
          # 需要在 GitHub Secrets 中配置一个能拉取子模块的 Token (如 PAT)
          DEPENDENCY_TOKEN: ${{ secrets.DEPENDENCY_TOKEN }} 
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Show Toolchain Versions
        run: |
          rustc --version
          cargo --version
          zig version || echo "zig not found"
          cargo-zigbuild --version || echo "cargo-zigbuild not found"

      - name: Build Binary
        run: |
          echo "Building yat-client for ${{ matrix.target }}..."
          if [ "${{ matrix.cross_compile }}" = "1" ]; then
            rustup target add "${{ matrix.target }}"
            cargo zigbuild --release --bin yat-client --target "${{ matrix.target }}"
          else
            cargo build --release --bin yat-client --target "${{ matrix.target }}"
          fi

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yat-client-${{ matrix.target }}
          path: target/*/release/yat-client
          retention-days: 7

  # ── Docker Stage ───────────────────────────────────────────────────────────
  docker:
    name: Build & Push Docker Image
    needs: build
    runs-on: ubuntu-latest
    # 控制只在 beta 分支或推送标签时触发
    if: github.ref == 'refs/heads/beta' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: target/artifacts

      - name: Organize Artifacts to Match Original Structure
        run: |
          # 将下载出来的多平台单文件放回原有目录，使 Makefile 的相对路径能够识别
          mkdir -p target/x86_64-unknown-linux-gnu/release
          mkdir -p target/x86_64-unknown-linux-musl/release
          mkdir -p target/aarch64-unknown-linux-gnu/release
          mkdir -p target/aarch64-unknown-linux-musl/release
          
          [ -f target/artifacts/yat-client-x86_64-unknown-linux-gnu/yat-client ] && cp target/artifacts/yat-client-x86_64-unknown-linux-gnu/yat-client target/x86_64-unknown-linux-gnu/release/ || true
          [ -f target/artifacts/yat-client-x86_64-unknown-linux-musl/yat-client ] && cp target/artifacts/yat-client-x86_64-unknown-linux-musl/yat-client target/x86_64-unknown-linux-musl/release/ || true
          [ -f target/artifacts/yat-client-aarch64-unknown-linux-gnu/yat-client ] && cp target/artifacts/yat-client-aarch64-unknown-linux-gnu/yat-client target/aarch64-unknown-linux-gnu/release/ || true
          [ -f target/artifacts/yat-client-aarch64-unknown-linux-musl/yat-client ] && cp target/artifacts/yat-client-aarch64-unknown-linux-musl/yat-client target/aarch64-unknown-linux-musl/release/ || true

      - name: Log in to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # 自动生成，无需手动配置

      - name: Process Docker Images (Beta Branch)
        if: github.ref == 'refs/heads/beta'
        run: |
          # 提取类似 GitLab CI 的 commit short sha
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-8)
          for libc in gnu musl; do make verify LIBC=$libc; done
          for libc in gnu musl; do make push TAG=beta-${SHORT_SHA} LIBC=$libc; done

      - name: Process Docker Images (Tag Release)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # 提取 Tag 名称
          TAG_NAME=${GITHUB_REF#refs/tags/}
          for libc in gnu musl; do make verify LIBC=$libc; done
          for libc in gnu musl; do make push TAG=${TAG_NAME} LIBC=$libc; done
